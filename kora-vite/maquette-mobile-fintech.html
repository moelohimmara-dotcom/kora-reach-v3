<title>KORA Mobile — Fintech Bold (maquette)</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --neon-lime: #C6FF00;
  --neon-purple: #A855F7;
  --neon-blue: #38BDF8;
  --text: #F4F6F8;
  --text-2: rgba(244,246,248,.62);
  --surface: rgba(10,14,10,.42);
  --border: rgba(255,255,255,.10);
}
html, body { height: 100%; }
body {
  font-family: Inter, system-ui, sans-serif;
  background: #050805;
  display: flex; justify-content: center;
  padding: 16px; /* safe area desktop preview */
}
/* Écran mobile */
.phone {
  width: 100%; max-width: 390px;
  min-height: 844px;
  background: linear-gradient(180deg, #16210F 0%, #2E4216 48%, #6E9316 78%, var(--neon-lime) 100%);
  border-radius: 28px; overflow: hidden;
  display: flex; flex-direction: column;
  position: relative;
  box-shadow: 0 30px 80px rgba(0,0,0,.6);
}
.screen { padding: 16px; display: flex; flex-direction: column; gap: 16px; flex: 1; padding-bottom: 84px; /* space bottom-nav */ }
/* Header */
.header { display: flex; align-items: center; justify-content: space-between; }
.logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 20px; color: var(--text); letter-spacing: .5px; }
.logo .k { width: 30px; height: 30px; border-radius: 8px; background: var(--neon-lime); color: #0a0f06; display: flex; align-items: center; justify-content: center; font-weight: 900; }
.status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: #3DD68C; box-shadow: 0 0 8px #3DD68C; }
.icon-btn { width: 44px; height: 44px; min-width: 44px; border: none; border-radius: 12px; background: rgba(0,0,0,.3); color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer; }
.ic { width: 20px; height: 20px; }
/* Donut */
.donut-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.donut { width: 180px; height: 180px; }
.donut-center { font-size: 30px; font-weight: 800; fill: var(--text); }
.donut-sub { font-size: 12px; fill: var(--text-2); }
/* KPI grid */
.kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.stat-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
  padding: 14px; display: flex; flex-direction: column; gap: 8px; min-height: 92px;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.stat-card.full { grid-column: 1 / -1; }
.stat-icon { width: 18px; height: 18px; color: var(--neon-lime); }
.stat-value { font-size: 30px; font-weight: 800; color: var(--text); line-height: 1; font-variant-numeric: tabular-nums; }
.stat-label { font-size: 13px; font-weight: 500; color: var(--text-2); }
/* Bottom nav */
.bottom-nav {
  position: absolute; left: 0; right: 0; bottom: 0;
  height: 60px; /* 56-64dp */
  display: flex; align-items: stretch;
  background: rgba(5,8,5,.72); backdrop-filter: blur(16px);
  border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom);
}
.nav-item {
  flex: 1; min-height: 44px; /* touch target */
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--text-2); font-size: 10px; font-weight: 600; position: relative; cursor: pointer;
}
.nav-item.active { color: var(--neon-lime); }
.nav-item .ic { width: 22px; height: 22px; }
.nav-item.active::after { content: ""; position: absolute; bottom: 4px; width: 22px; height: 3px; border-radius: 2px; background: var(--neon-lime); }
.badge { position: absolute; top: 6px; right: 50%; margin-right: -18px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: #E5484D; color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
</style></head>

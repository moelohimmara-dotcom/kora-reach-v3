<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KORA Agent — Poste de pilotage éditorial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Police display non bloquante : on charge en "print" puis on bascule en
     "all" une fois prete (technique standard pour accelerer le first paint). -->
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap"></noscript>
<script>
  // Anti-FOUC : applique le thème avant le premier paint (évite flash clair→sombre).
  (function () {
    try {
      var t = localStorage.getItem("kora-theme");
      if (!t) t = "dark"; // KORA est dark par défaut (coherence marque) -> pas de bascule auto sur le mode clair du telephone
      if (["dark", "light", "cacao"].indexOf(t) === -1) t = "dark";
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) { document.documentElement.setAttribute("data-theme", "dark"); }
  })();
  // Anti-FOUC icônes : on masque .material-icons (CSS) jusqu'à ce que la police
  // Material Icons soit prête, pour éviter le flash de texte (ex: "visibility"
  // sur l'œil du mot de passe). Révélé dès fonts.ready ou après 1500ms de sécu.
  (function () {
    var done = false;
    function reveal() { if (!done) { done = true; document.documentElement.classList.add("icons-ready"); } }
    if (document.fonts && document.fonts.load) {
      Promise.race([
        document.fonts.load('1em "Material Icons"').catch(function(){}),
        new Promise(function(r){ setTimeout(r, 1500); })
      ]).then(reveal);
    } else { reveal(); }
    // Sécurité absolue : si fonts.ready ne se déclenche pas, on révèle après 2s.
    setTimeout(reveal, 2000);
  })();
</script>
<!-- CSS CRITIQUE INLINE du splash de boot : peint IMMEDIATEMENT (avant style.css
     externe) -> aucun flash de page vide/partielle au refresh. Methode SPA
     standard (app-shell + loader statique masque au montage de l'app). -->
<style>
  #bootSplash {
    position: fixed; inset: 0; z-index: 9999;
    background: #15171D;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; color: #E6C079; font-family: "Montserrat", system-ui, sans-serif;
  }
  #bootSplash .bs-logo { font-weight: 800; font-size: 30px; letter-spacing: 2px; color: #FF6B4A; }
  #bootSplash .bs-sub { font-size: 13px; color: #8A93A6; letter-spacing: 1px; }
  #bootSplash .bs-wave { display: flex; gap: 7px; }
  #bootSplash .bs-wave i {
    width: 9px; height: 9px; border-radius: 50%; background: #FF6B4A;
    animation: bs-bounce 1s infinite ease-in-out both;
  }
  #bootSplash .bs-wave i:nth-child(1) { animation-delay: -0.32s; }
  #bootSplash .bs-wave i:nth-child(2) { animation-delay: -0.16s; }
  #bootSplash .bs-wave i:nth-child(3) { animation-delay: 0s; }
  #bootSplash .bs-wave i:nth-child(4) { animation-delay: 0.16s; }
  #bootSplash .bs-wave i:nth-child(5) { animation-delay: 0.32s; }
  @keyframes bs-bounce { 0%, 80%, 100% { transform: scale(0.5); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="authOverlay" hidden></div>
<!-- Splash de boot : visible des le premier paint, masque par app.js une fois
     l'app reellement montee (auth resolue + vue rendue). -->
<div id="bootSplash">
  <div class="bs-logo">KORA</div>
  <div class="bs-wave"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="bs-sub">VEILLE GUINÉE</div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>

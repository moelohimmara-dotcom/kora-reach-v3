<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KORA — Rendu réel icônes hybrides</title>
<link rel="stylesheet" href="./assets/style-B2-Bz6JX.css">
<style>
  body{margin:0;background:var(--neu-base);min-height:100vh;color:var(--on-surface);font-family:var(--font);}
  .wrap{max-width:1180px;margin:0 auto;padding:32px 24px;display:grid;grid-template-columns:230px 1fr;gap:28px;align-items:start;}
  /* --- RAIL --- */
  .rail{display:flex;flex-direction:column;gap:8px;}
  .rail .navitem{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:var(--radius-lg);background:var(--neu-base);box-shadow:var(--neu-raised);border:none;color:var(--on-surface);cursor:pointer;font-size:15px;font-weight:600;}
  .rail .navitem .ic{width:24px;height:24px;color:var(--coral);}
  .rail .navitem.active{box-shadow:var(--neu-pressed);color:var(--coral);}
  .rail .navitem .rail-item-label{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.5px;font-size:13px;}
  /* --- CONTENT --- */
  h1{font-family:var(--font-display);font-size:26px;color:var(--coral);margin:0 0 4px;}
  .sub{color:var(--on-surface-soft);margin-bottom:24px;font-size:14px;}
  .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:24px;}
  .stat-card{padding:18px;border-radius:var(--radius-lg);background:var(--neu-base);box-shadow:var(--neu-raised);text-align:center;}
  .stat-label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--on-surface-soft);font-weight:700;}
  .stat-card .n{font-family:var(--font-display);font-size:30px;font-weight:800;}
  /* --- BOTTOM NAV --- */
  .bottomnav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--neu-base);box-shadow:var(--neu-raised);padding:8px 4px calc(8px + env(safe-area-inset-bottom));}
  .bottomnav .navitem{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;border:none;background:none;color:var(--on-surface);cursor:pointer;padding:6px 2px;}
  .bottomnav .navitem .ic{width:24px;height:24px;}
  .bottomnav .navitem.active{color:var(--coral);}
  .bottomnav .navitem span{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  /* --- ACTION ROW --- */
  .actions{display:flex;gap:10px;margin-top:8px;}
  .icon-btn{width:40px;height:40px;border-radius:var(--radius-pill);border:1px solid var(--glass-border-strong);background:var(--neu-base);box-shadow:var(--neu-raised);color:var(--on-surface);display:grid;place-items:center;cursor:pointer;}
  .icon-btn .ic{width:20px;height:20px;color:var(--coral);}
  .ctitle{font-family:var(--font-display);text-transform:uppercase;letter-spacing:1px;font-size:13px;color:var(--on-surface-soft);margin:22px 0 10px;}
</style>
</head>
<body>
<div class="wrap">
  <!-- RAIL -->
  <nav class="rail">
    <button class="navitem active"><svg class="ic"><use href="#i-dashboard"/></svg><span class="rail-item-label">Tableau de bord</span></button>
    <button class="navitem"><svg class="ic"><use href="#i-facts"/></svg><span class="rail-item-label">Articles</span></button>
    <button class="navitem"><svg class="ic"><use href="#i-check"/></svg><span class="rail-item-label">Validation</span></button>
    <button class="navitem"><svg class="ic"><use href="#i-sources"/></svg><span class="rail-item-label">Sources</span></button>
    <button class="navitem"><svg class="ic"><use href="#i-edit"/></svg><span class="rail-item-label">Brouillons</span></button>
    <button class="navitem"><svg class="ic"><use href="#i-trash"/></svg><span class="rail-item-label">Corbeille</span></button>
    <button class="navitem"><svg class="ic"><use href="#i-settings"/></svg><span class="rail-item-label">Réglages</span></button>
  </nav>
  <!-- CONTENT -->
  <div>
    <h1>KORA Agent</h1>
    <div class="sub">Rendu réel des icônes hybrides (conteneur gm + glyph sémantique) dans le thème neumorphisme sombre.</div>
    <div class="cards">
      <div class="stat-card"><div class="stat-label">Sources OK</div><div class="n">0</div></div>
      <div class="stat-card"><div class="stat-label">Éléments cycle</div><div class="n">0</div></div>
    </div>
    <div class="ctitle">Icônes d'action</div>
    <div class="actions">
      <button class="icon-btn"><svg class="ic"><use href="#i-edit"/></svg></button>
      <button class="icon-btn"><svg class="ic"><use href="#i-check"/></svg></button>
      <button class="icon-btn"><svg class="ic"><use href="#i-reject"/></svg></button>
      <button class="icon-btn"><svg class="ic"><use href="#i-refresh"/></svg></button>
      <button class="icon-btn"><svg class="ic"><use href="#i-trash"/></svg></button>
      <button class="icon-btn"><svg class="ic"><use href="#i-send"/></svg></button>
      <button class="icon-btn"><svg class="ic"><use href="#i-undo"/></svg></button>
      <button class="icon-btn"><svg class="ic"><use href="#i-lock"/></svg></button>
      <button class="icon-btn"><svg class="ic"><use href="#i-user"/></svg></button>
      <button class="icon-btn"><svg class="ic"><use href="#i-info"/></svg></button>
    </div>
  </div>
</div>
<!-- BOTTOM NAV -->
<nav class="bottomnav">
  <button class="navitem active"><svg class="ic"><use href="#i-dashboard"/></svg><span>Tableau</span></button>
  <button class="navitem"><svg class="ic"><use href="#i-facts"/></svg><span>Articles</span></button>
  <button class="navitem"><svg class="ic"><use href="#i-check"/></svg><span>Validation</span></button>
  <button class="navitem"><svg class="ic"><use href="#i-sources"/></svg><span>Sources</span></button>

  <button class="navitem"><svg class="ic"><use href="#i-trash"/></svg><span>Corbeille</span></button>
  <button class="navitem"><svg class="ic"><use href="#i-settings"/></svg><span>Réglages</span></button>
</nav>

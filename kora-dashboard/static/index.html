<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KORA OPS — Tableau de bord agent</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <!-- Top app bar -->
  <header class="app-bar">
    <button class="icon-btn" id="menuBtn" aria-label="Menu">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div class="app-bar-title">KORA <span class="muted">OPS</span></div>
    <span class="db-pill" id="dbPill">…</span>
  </header>

  <!-- Side drawer (>=821px) / scrim + drawer (<=820px) -->
  <div class="scrim" id="scrim" hidden></div>
  <nav class="drawer" id="drawer" aria-label="Sections">
    <div class="drawer-head">KORA OPS</div>
    <a class="nav-item active" data-view="stats" href="#stats">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13h4v8H3zM10 3h4v18h-4zM17 9h4v12h-4z"/></svg>
      <span>Statistiques</span>
    </a>
    <a class="nav-item" data-view="facts" href="#facts">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v4H4zM4 10h16v4H4zM4 16h10v4H4z"/></svg>
      <span>Facts</span>
    </a>
    <a class="nav-item" data-view="audit" href="#audit">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18M7 14l3-3 3 3 5-5"/></svg>
      <span>Audit</span>
    </a>
    <a class="nav-item" data-view="config" href="#config">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 100 8 4 4 0 000-8zM3 12h2m14 0h2M12 3v2m0 14v2"/></svg>
      <span>Config</span>
    </a>
  </nav>

  <main class="content" id="content">
    <section class="view" data-view="stats">
      <h1 class="view-title">Statistiques</h1>
      <div class="stat-grid" id="statGrid"></div>
    </section>
    <section class="view" data-view="facts" hidden>
      <h1 class="view-title">Facts (HITL)</h1>
      <div class="list" id="factsList"></div>
    </section>
    <section class="view" data-view="audit" hidden>
      <h1 class="view-title">Audit récent</h1>
      <div class="list" id="auditList"></div>
    </section>
    <section class="view" data-view="config" hidden>
      <h1 class="view-title">Configuration</h1>
      <div class="list" id="configList"></div>
    </section>
  </main>

  <!-- Bottom tab bar (<=820px) -->
  <nav class="tab-bar" id="tabBar" aria-label="Navigation">
    <a class="tab active" data-view="stats" href="#stats"><svg class="ic" viewBox="0 0 24 24"><path d="M3 13h4v8H3zM10 3h4v18h-4zM17 9h4v12h-4z"/></svg><span>Stats</span></a>
    <a class="tab" data-view="facts" href="#facts"><svg class="ic" viewBox="0 0 24 24"><path d="M4 4h16v4H4zM4 10h16v4H4zM4 16h10v4H4z"/></svg><span>Facts</span></a>
    <a class="tab" data-view="audit" href="#audit"><svg class="ic" viewBox="0 0 24 24"><path d="M3 3v18h18M7 14l3-3 3 3 5-5"/></svg><span>Audit</span></a>
    <a class="tab" data-view="config" href="#config"><svg class="ic" viewBox="0 0 24 24"><path d="M12 8a4 4 0 100 8 4 4 0 000-8zM3 12h2m14 0h2M12 3v2m0 14v2"/></svg><span>Config</span></a>
  </nav>

  <script src="/app.js"></script>
</body>
</html>

# HTTP → HTTPS redirect (staging)
server {
    listen 80;
    server_name staging.213.156.135.139.sslip.io;
    return 301 https://$server_name$request_uri;
}

# HTTPS server for staging.213.156.135.139.sslip.io — ENVIRONNEMENT DE TEST
# (2026-08-27, isole de la prod : service systemd separe (kora-reach-staging,
# port 8768), base Postgres separee (kora_staging), certificat TLS dedie --
# aucun risque de collision de cookie de session avec la prod, meme
# hebergeur/IP.)
server {
    listen 443 ssl http2;
    client_max_body_size 10M;
    server_name staging.213.156.135.139.sslip.io;

    ssl_certificate /etc/letsencrypt/live/staging.213.156.135.139.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.213.156.135.139.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Cache-Control "no-store, no-cache, must-revalidate";
    expires -1;

    location /kora-v2/ {
        alias /opt/kora-reach-staging/repo/static/;
        try_files $uri $uri/ /kora-v2/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }

    location /kora-v2/api/ {
        rewrite ^/kora-v2/api/(.*)$ /api/$1 break;
        proxy_pass http://127.0.0.1:8768;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_request_headers on;
        proxy_read_timeout 600s;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }

    location /kora-v2/media/ {
        alias /opt/kora-reach-staging/repo/generated/videos/;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }
}

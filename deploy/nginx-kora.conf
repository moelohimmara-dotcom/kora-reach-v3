# nginx-kora.conf — reverse proxy + HTTPS (certbot)
# Install : cp vers /etc/nginx/sites-available/kora-reach, ln -s dans sites-enabled, nginx -t, systemctl reload nginx
# Puis : certbot --nginx -d kora.tondomaine.com
server {
    listen 80;
    server_name kora.tondomaine.com;

    # Rate-limit basique (anti-abuse)
    limit_req_zone $binary_remote_addr zone=koralimit:10m rate=10r/s;
    location / {
        limit_req zone=koralimit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Interdiction de l'accès direct aux fichiers .env / statiques sensibles
    location ~ /\.(env|py|db)$ {
        deny all;
    }

    # Headers sécu
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self';" always;
}

# Après certbot, ce bloc devient listen 443 ssl; (certbot l'ajoute automatiquement)

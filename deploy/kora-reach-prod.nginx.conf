# HTTP → HTTPS redirect (for sslip.io domain with dots)
server {
    listen 80;
    server_name 213.156.135.139.sslip.io;
    return 301 https://$server_name$request_uri;
}

# HTTP → HTTPS redirect (for sslip.io domain with dashes - legacy)
server {
    listen 80;
    server_name 213-156-135-139.sslip.io;
    return 301 https://$server_name$request_uri;
}

# HTTPS server for 213.156.135.139.sslip.io (dots) — MAIN PRODUCTION
server {
    listen 443 ssl http2;
    client_max_body_size 10M;
    server_name 213.156.135.139.sslip.io;

    ssl_certificate /etc/letsencrypt/live/213.156.135.139.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/213.156.135.139.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Anti-cache agressif : no-store empêche TOUTE mise en cache (contrairement à no-cache)
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    expires -1;

    # ── KORA FRONTEND (racine, par défaut) ──
    location / {
        alias /opt/kora-reach/static/;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }

    # ── KORA FRONTEND (static, legacy /kora-v2/) ──
    location /kora-v2/ {
        alias /opt/kora-reach/static/;
        try_files $uri $uri/ /kora-v2/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }

    # ── KORA Reach API (back-end) ──
    location /kora-v2/api/ {
        rewrite ^/kora-v2/api/(.*)$ /api/$1 break;
        proxy_pass http://127.0.0.1:8766;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_request_headers on;
        proxy_read_timeout 600s;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }

    # ── KORA videos narrees (2026-08-20) : fichiers .mp4 generes par
    # orchestration/video.py, SEPARE du dossier static/ (frontend, remplace
    # a chaque deploiement) pour ne jamais risquer de les effacer. ──
    location /kora-v2/media/ {
        alias /opt/kora-reach/generated/videos/;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }
}

